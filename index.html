
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipMaster AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:white;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #303044;color:#a78bfa;font-size:23px;font-weight:bold}
main{max-width:700px;margin:25px auto;padding:18px}
h1{text-align:center;font-size:28px}
.sub{text-align:center;color:#aaa;line-height:1.6}
.card{background:#171a2a;padding:20px;border:1px solid #33364b;border-radius:16px;margin-top:22px}
label{display:block;margin:18px 0 9px;font-weight:bold}
input,select{width:100%;padding:14px;border-radius:9px;background:#0c1020;color:white;border:1px solid #45465a}
button{width:100%;padding:15px;margin-top:18px;background:#8055ed;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold}
.preview{display:none;margin-top:20px}
.preview img{width:100%;border-radius:10px}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
#status{margin-top:15px;color:#d7c8ff;line-height:1.6}
footer{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>
<header>✦ ClipMaster AI</header>
<main>
<h1>Turn Long Videos Into Shorts</h1>
<p class="sub">AI-powered YouTube Video Clipping Studio</p>

<div class="card">
<h2>🚀 Create Your Clips</h2>

<label>YouTube Video Link</label>
<input id="url" type="url" placeholder="Paste YouTube URL here">

<button onclick="checkVideo()">🔍 Check YouTube Video</button>

<div class="preview" id="preview">
<h3>📺 Video Preview</h3>
<div id="videoBox"></div>
<h3 id="videoTitle"></h3>
</div>

<hr style="border-color:#38384b;margin-top:25px">

<h2>✂️ Clip Settings</h2>

<label>Clip Duration</label>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="45">45 Seconds</option>
<option value="60">60 Seconds</option>
</select>

<label>Video Format</label>
<select id="format">
<option value="9:16">Vertical 9:16</option>
<option value="16:9">Landscape 16:9</option>
</select>

<label>Caption Language</label>
<select id="language">
<option>English</option>
<option>Hindi</option>
<option>Hinglish</option>
</select>

<label>Caption Font Size</label>
<select id="fontSize">
<option value="20">20px</option>
<option value="24">24px</option>
<option value="28">28px</option>
</select>

<label>Caption Color</label>
<select id="color">
<option value="white">White</option>
<option value="yellow">Yellow</option>
<option value="cyan">Cyan</option>
<option value="lime">Green</option>
</select>

<label>Caption Position</label>
<select id="position">
<option>Top</option>
<option selected>Center</option>
<option>Bottom</option>
</select>

<button onclick="startAnalysis()">✨ Find Viral Moments</button>

<div id="status"></div>
</div>
</main>

<footer>ClipMaster AI © 2026</footer>

<script>
let videoId = "";

function getVideoId(value){
 try{
  const u = new URL(value);
  if(u.hostname === "youtu.be"){
   return u.pathname.split("/")[1];
  }
  if(u.hostname.endsWith("youtube.com")){
   if(u.pathname === "/watch"){
    return u.searchParams.get("v");
   }
   const parts = u.pathname.split("/");
   if(["shorts","embed","live"].includes(parts[1])){
    return parts[2];
   }
  }
 }catch(e){}
 return null;
}

function checkVideo(){
 const url=document.getElementById("url").value.trim();
 const status=document.getElementById("status");
 const id=getVideoId(url);

 if(!id){
  status.textContent="❌ Please enter a valid YouTube video link.";
  document.getElementById("preview").style.display="none";
  return;
 }

 videoId=id;

 document.getElementById("preview").style.display="block";
 document.getElementById("videoBox").innerHTML=
 '<iframe src="https://www.youtube.com/embed/'+
 encodeURIComponent(id)+
 '" allowfullscreen></iframe>';

 document.getElementById("videoTitle").textContent=
 "YouTube Video ID: "+id;

 status.textContent="✅ Video link recognized! Preview loaded if embedding is allowed.";
}

function startAnalysis(){
 const status=document.getElementById("status");

 if(!videoId){
  status.textContent="❌ First check your YouTube video link.";
  return;
 }

 status.textContent=
 "✅ Video link verified! Settings saved. "+
 "AI processing backend is the next development step. "+
 "No clips have been generated yet.";
}
</script>
</body>
</html>
